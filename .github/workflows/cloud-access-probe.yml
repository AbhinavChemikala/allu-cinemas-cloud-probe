name: Cloud access feasibility probe
on:
  workflow_dispatch:
    inputs:
      browser_mode:
        description: Browser mode for the bounded source-access probe
        type: choice
        options: [headless, headed]
        default: headed
permissions:
  contents: read
concurrency:
  group: cloud-access-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install -r cloud-probe/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate result classification
        run: python -m unittest discover -s cloud-probe -p 'test_*.py' -v
      - name: Probe source from a hosted runner
        env:
          BROWSER_MODE: ${{ inputs.browser_mode }}
        run: |
          if [ "$BROWSER_MODE" = "headed" ]; then
            xvfb-run --auto-servernum python cloud-probe/probe.py --headed --rounds 2 --interval 60 --stagger 10
          else
            python cloud-probe/probe.py --rounds 2 --interval 60 --stagger 10
          fi
      - name: Save sanitized source-access report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-source-access
          path: output/cloud-probe/report.json
          if-no-files-found: warn
          retention-days: 3
